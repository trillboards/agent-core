# Project-wide Gradle settings (mirrors trillboards/packages monorepo's
# trillboard-ctv/tablet-agent/gradle.properties).

# Enable AndroidX (required by AGP 8.x; transitive deps like androidx.core
# wouldn't load otherwise).
android.useAndroidX=true

# Use non-transitive R classes — smaller R.class files in the published AAR.
android.nonTransitiveRClass=true

# Kotlin official style (matches monorepo).
kotlin.code.style=official

# JVM heap. The full agent-core source (~180 files incl. FunctionGemma / on-device
# LLM) OOM'd the Kotlin compiler worker on JitPack at 2 GB ("Could not load module
# <Error module>"). Run the Kotlin compile IN-PROCESS (one JVM, no separate compiler
# daemon to double memory) with a larger heap, single-worker, no incremental — so the
# whole build fits one ~4 GB process on JitPack's builder. (Verified: source compiles
# clean locally; this is purely a JitPack memory-fit fix.)
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=false
org.gradle.parallel=false
org.gradle.workers.max=1
